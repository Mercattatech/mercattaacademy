# Produção na VPS: Postgres 16 + PgBouncer (TLS) + MinIO atrás de HTTPS (Caddy).
# O app Next.js roda na Vercel e chega aqui por:
#   - PgBouncer, porta 6432, com TLS  -> DATABASE_URL
#   - https://S3_DOMAIN (Caddy)       -> S3_ENDPOINT
# O Postgres NÃO fica aberto: só escuta em 127.0.0.1 (migrations por túnel SSH).
#
# Uso (na VPS, dentro de deploy/):
#   cp .env.prod.example .env.prod   # e preencha tudo
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
name: pos-saas

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env.prod}
      POS_OWNER_PASSWORD: ${POS_OWNER_PASSWORD:?defina no .env.prod}
      POS_APP_PASSWORD: ${POS_APP_PASSWORD:?defina no .env.prod}
    # Só local: migrations e backup. Nunca publique 5432 na internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/setup/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./initdb/02-passwords.sh:/docker-entrypoint-initdb.d/02-passwords.sh:ro
      - ../db/setup/database.sql:/docker-entrypoint-initdb.d/03-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pool de conexões em modo transaction (o app usa set_config local à transação,
  # que funciona nesse modo). Só o papel pos_app passa por aqui.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: pos_app
      DB_PASSWORD: ${POS_APP_PASSWORD}
      DB_NAME: pos_saas
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "300"
      DEFAULT_POOL_SIZE: "20"
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_CERT_FILE: /certs/server.crt
      CLIENT_TLS_KEY_FILE: /certs/server.key
    ports:
      - "6432:5432"
    volumes:
      - ./certs:/certs:ro

  minio:
    image: alpine/minio:latest-release
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina no .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina no .env.prod}
    # Sem portas públicas: quem expõe é o Caddy (HTTPS).
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      S3_DOMAIN: ${S3_DOMAIN:?defina no .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?defina no .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
